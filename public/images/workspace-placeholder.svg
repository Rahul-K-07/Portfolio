<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="workspaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1918"/>
      <stop offset="100%" stop-color="#100F0E"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#workspaceBg)"/>
  
  <!-- Grid -->
  <line x1="100" y1="0" x2="100" y2="800" stroke="rgba(241, 235, 221, 0.05)" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="800" stroke="rgba(241, 235, 221, 0.05)" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="800" stroke="rgba(241, 235, 221, 0.05)" stroke-width="1"/>
  <line x1="0" y1="200" x2="1000" y2="200" stroke="rgba(241, 235, 221, 0.05)" stroke-width="1"/>
  <line x1="0" y1="600" x2="1000" y2="600" stroke="rgba(241, 235, 221, 0.05)" stroke-width="1"/>

  <!-- Minimalist desk setup graphic -->
  <rect x="250" y="240" width="500" height="300" rx="6" fill="#141312" stroke="rgba(241, 235, 221, 0.15)" stroke-width="1.5"/>
  <rect x="470" y="540" width="60" height="70" fill="#242220"/>
  <rect x="420" y="610" width="160" height="8" rx="4" fill="#32302C"/>

  <!-- Code editor lines -->
  <rect x="270" y="260" width="460" height="260" fill="#181716"/>
  <circle cx="290" cy="280" r="4" fill="#B34A43"/>
  <circle cx="305" cy="280" r="4" fill="#8E8981" opacity="0.5"/>
  <circle cx="320" cy="280" r="4" fill="#8E8981" opacity="0.5"/>
  <line x1="290" y1="310" x2="420" y2="310" stroke="#B34A43" stroke-width="2"/>
  <line x1="290" y1="335" x2="550" y2="335" stroke="rgba(241, 235, 221, 0.4)" stroke-width="2"/>
  <line x1="310" y1="360" x2="480" y2="360" stroke="rgba(241, 235, 221, 0.2)" stroke-width="2"/>
  <line x1="310" y1="385" x2="620" y2="385" stroke="rgba(241, 235, 221, 0.3)" stroke-width="2"/>
  <line x1="290" y1="410" x2="380" y2="410" stroke="#B34A43" stroke-width="2"/>

  <!-- Label -->
  <text x="500" y="680" fill="#8E8981" font-family="monospace" font-size="12" letter-spacing="3" text-anchor="middle">
    WORKSPACE &amp; EXPERIMENTAL LAB // LINUX &amp; EMBEDDED
  </text>
  <text x="500" y="710" fill="#B34A43" font-family="monospace" font-size="11" letter-spacing="2" text-anchor="middle">
    [ SYSTEM TESTING: PYTHON / EMBEDDED / ML PIPELINES ]
  </text>
</svg>
