<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191816"/>
      <stop offset="100%" stop-color="#0E0D0C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(241, 235, 221, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <!-- Editorial Framing -->
  <rect x="60" y="60" width="1080" height="680" fill="none" stroke="rgba(241, 235, 221, 0.12)" stroke-width="1"/>
  <line x1="60" y1="120" x2="1140" y2="120" stroke="rgba(241, 235, 221, 0.08)" stroke-width="1"/>

  <!-- Header meta -->
  <text x="90" y="98" fill="#8E8981" font-family="monospace" font-size="14" letter-spacing="3">FIG. 03 // COMMERCIAL PRODUCTION ARCHIVE</text>
  <text x="1110" y="98" fill="#B34A43" font-family="monospace" font-size="14" text-anchor="end" letter-spacing="3">STATUS: CONFIDENTIAL CLIENT CASE</text>

  <!-- Storefront wireframe mock -->
  <rect x="120" y="160" width="960" height="520" rx="4" fill="#141312" stroke="rgba(241, 235, 221, 0.08)" stroke-width="1"/>
  
  <!-- Mini browser bar -->
  <circle cx="150" cy="190" r="5" fill="#B34A43"/>
  <circle cx="170" cy="190" r="5" fill="#8E8981" opacity="0.4"/>
  <circle cx="190" cy="190" r="5" fill="#8E8981" opacity="0.4"/>
  <line x1="220" y1="190" x2="500" y2="190" stroke="rgba(241, 235, 221, 0.1)" stroke-width="2"/>

  <!-- Storefront content sketch -->
  <rect x="150" y="230" width="420" height="260" fill="#1E1D1B" stroke="rgba(241, 235, 221, 0.06)"/>
  <text x="180" y="280" fill="#F1EBDD" font-family="serif" font-size="28" font-style="italic">CURATED CATALOG</text>
  <line x1="180" y1="310" x2="360" y2="310" stroke="#B34A43" stroke-width="2"/>
  <rect x="180" y="340" width="220" height="12" rx="2" fill="rgba(241, 235, 221, 0.2)"/>
  <rect x="180" y="365" width="160" height="12" rx="2" fill="rgba(241, 235, 221, 0.1)"/>
  
  <rect x="180" y="410" width="140" height="36" rx="18" fill="none" stroke="#B34A43" stroke-width="1.5"/>
  <text x="250" y="433" fill="#F1EBDD" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">EXPLORE</text>

  <!-- Product grid cards sketch -->
  <rect x="610" y="230" width="220" height="260" fill="#1B1A18" stroke="rgba(241, 235, 221, 0.05)"/>
  <rect x="630" y="250" width="180" height="150" fill="#242220"/>
  <rect x="630" y="420" width="120" height="10" fill="rgba(241, 235, 221, 0.2)"/>
  <rect x="630" y="440" width="70" height="10" fill="#B34A43" opacity="0.8"/>

  <rect x="850" y="230" width="200" height="260" fill="#1B1A18" stroke="rgba(241, 235, 221, 0.05)"/>
  <rect x="870" y="250" width="160" height="150" fill="#242220"/>
  <rect x="870" y="420" width="100" height="10" fill="rgba(241, 235, 221, 0.2)"/>
  <rect x="870" y="440" width="60" height="10" fill="#B34A43" opacity="0.8"/>

  <!-- Footer note -->
  <text x="600" y="715" fill="#8E8981" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">
    CUSTOM SHOPIFY THEME // LIQUID TEMPLATING // RESPONSIVE COMMERCE
  </text>
</svg>
